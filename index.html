        <header class="header">
            <img src="./images/logo.svg" alt="Spot Logo" class="header__logo">
        </header>

            <section class="profile page__section">
                <img src="./images/avatar.jpg" alt="User Avatar" class="profile__avatar">
                <div class="profile__column">
                    <h1 class="profile__name">Bessie Coleman</h1>
                    <p class="profile__description">Civil Aviator</p>
                    <button type="button" class="profile__edit-btn">
                        <img src="./images/pencil_dark.svg" alt="Pencil Icon" /> Edit Profile
                    </button>
                </div>
                <button type="button" class="profile__add-btn">
                    <img src="./images/plus.svg" alt="Plus Icon" /> New Post
                </button>
            </section>
            <section class="cards page__section">
                <ul class="cards__list">
                    <template id="card-template">
                        <li class="card">
                            <button
                            type="button"
                            class="card__delete-button"
                            aria-label="Delete card">
                            </button>

                            <img src="#" alt="" class="card__image">

                            <div class="card__footer">
                            <h2 class="card__title"></h2>
                            <button
                            type="button"
                            class="card__like-button"
                            aria-label="Like card">
                            </button>
                            </div>
                        </li>
                    </template>

        </main>
        <footer class="footer">2026 &copy; Spots</footer>
        <div class="modal" id="edit-profile-modal">
            <div class="modal__container">
                <button type="button" class="modal__close-btn"></button>
                <h2 class="modal__title">Edit Profile</h2>
                <form class="modal__form" novalidate>
                    <label for="profile-name-input" class="modal__label"> Name
                        <input 
                        id="profile-name-input" 
                        type="text" 
                        class="modal__input" 
                        placeholder="Type your name" 
                        required minlength="2" 
                        maxlength="40"
                        >
                        <span
                        class="modal__error"
                        id="profile-name-input-error"
                        >
                        </span>
                    </label>
                    <label for="profile-description-input" class="modal__label"> Description
                        <input 
                        id="profile-description-input" 
                        type="text" 
                        class="modal__input"
                        placeholder="Describe yourself" 
                        required minlength="2" maxlength="200"
                        >
                        <span
                        class="modal__error"
                        id="profile-description-input-error"
                        >
                        </span>
                    </label>
                    <button class="modal__submit-btn" type="submit">Save</button>
                </form>
            </div>
        </div>
        <div class="modal" id="new-post-modal">
            <div class="modal__container">
                <button type="button" class="modal__close-btn"></button>
                <h2 class="modal__title">New Post</h2>
                <form class="modal__form" novalidate>
                    <label for="card-image-input" class="modal__label"> Image link
                        <input 
                        id="card-image-input" 
                        type="url" 
                        class="modal__input"
                        placeholder="Paste a link to the picture" 
                        required
                        >
                        <span
                        class="modal__error"
                        id="card-image-input-error"
                        >
                        </span>
                    </label>
                    <label for="card-caption-input" class="modal__label"> Caption
                        <input 
                        id="card-caption-input" 
                        type="text" 
                        class="modal__input" 
                        placeholder="Type your caption"
                        required minlength="2" maxlength="30"
                        >
                        <span
                        class="modal__error"
                        id="card-caption-input-error"
                        >
                        </span>
                    </label>
                    <button class="modal__submit-btn" type="submit">Save</button>
                </form>
            </div>
        </div>
